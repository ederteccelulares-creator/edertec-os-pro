name: Build Edertec OS Pro
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Upload Hostinger deployment package
        uses: actions/upload-artifact@v4
        with:
          name: eparts-hostinger-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
      - name: Check WhatsApp Edge Function
        run: deno check supabase/functions/respond-service-order-quote/index.ts
      - name: Check company backup restore Edge Function
        run: deno check supabase/functions/restore-company-backup/index.ts

  database-migrations:
    name: PostgreSQL migration and security checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edertec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edertec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create isolated Supabase Auth test harness
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edertec_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/postgres_auth_harness.sql
      - name: Apply all database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edertec_test
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run current company-schema security regression checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edertec_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/company_schema_security.sql
      - name: Run two-tenant RLS smoke tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edertec_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/tenant_isolation_rls.sql
      - name: Run company backup export security tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edertec_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/company_backup_export.sql
      - name: Run transactional backup restore tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edertec_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/backup_restore_transactional.sql
