name: Deploy Supabase (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy current company Edge Functions
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy current company Edge Functions
        run: |
          supabase functions deploy company-login --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy company-team --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy send-company-welcome --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy restore-company-backup --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy whatsapp-webhook --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy mercadopago-billing --project-ref "$SUPABASE_PROJECT_REF"

      # Database migrations are intentionally not applied by this workflow.
      # Production migration history must be reconciled before enabling db push.
